name: Build macOS installer
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    name: Test and package · Apple Silicon
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$(tr -d '\n' < VERSION)"
      - name: Regression tests
        run: scripts/test.sh
      - name: Build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        run: |
          test "$(uname -m)" = arm64
          brew install libmtp
          scripts/fetch-macfuse.sh
          # Only this disposable GitHub-hosted VM is changed, never a user Mac.
          sudo installer -pkg .build/vendor/macFUSE.pkg -target /
      - name: Build application and installer
        run: |
          app/build-app.sh
          scripts/build-package.sh
      - name: Inspect installer without installing it
        run: |
          installer -showChoicesXML -pkg dist/KindleDock-arm64.pkg -target / > .build/installer-choices.xml
          python3 scripts/validate-package.py dist/KindleDock-arm64.pkg .build/installer-choices.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KindleDock-arm64
          path: |
            dist/*.pkg
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: KindleDock-arm64
          path: release
      - name: Publish installer, disk image, portable app and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --verify-tag --title "KindleDock $TAG" --notes-file docs/RELEASE-NOTES.md
          fi
